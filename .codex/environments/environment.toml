[[actions]]
name = "GATA · Ejecutar pruebas estructurales"
icon = "tool"
command = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version Latest

$StartPath = if (
    -not [string]::IsNullOrWhiteSpace($env:CODEX_WORKTREE_PATH)
) {
    $env:CODEX_WORKTREE_PATH
} else {
    (Get-Location).Path
}

$GitTop = (
    & git -C $StartPath rev-parse --show-toplevel
).Trim()

if ($LASTEXITCODE -ne 0) {
    throw 'BLOCKED_GIT_TOPLEVEL_UNRESOLVED'
}

$GitStatus = (
    & git -C $GitTop status --short
)

if ($GitStatus) {
    throw "BLOCKED_DIRTY_TREE_BEFORE_TESTS: $GitStatus"
}

$Head = (
    & git -C $GitTop rev-parse HEAD
).Trim()

$CodeRoot = Join-Path $GitTop `
    'GATA_ModuleC_pipeline_unified_20260529_110352\01_REPO_COPY'

$ToolRoot = Join-Path $env:LOCALAPPDATA `
    'OpenAI\Codex\project-tools\GATA_MODULEC_UNIFIED_PROCESS\py314-pytest911'

$ToolPython = Join-Path $ToolRoot `
    'Scripts\python.exe'

if (-not (Test-Path -LiteralPath $ToolPython)) {
    throw 'BLOCKED_TEST_TOOLING_NOT_INSTALLED'
}

$CandidateTargets = @(
    'tests/test_structural_launcher_contract.py',
    'tests/test_phase1b_structural_completion.py',
    'tests/test_test_tooling_bootstrap_contract.py',
    'tests/test_test_tooling_bootstrap_phase2b.py'
)

$Targets = @(
    $CandidateTargets |
        Where-Object {
            Test-Path -LiteralPath (Join-Path $CodeRoot $_)
        }
)

if ($Targets.Count -eq 0) {
    throw 'BLOCKED_NO_STRUCTURAL_TEST_TARGETS_FOUND'
}

$Timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
$Sha8 = $Head.Substring(0, 8).ToUpperInvariant()

$EvidenceRoot = Join-Path `
    (Join-Path `
        (Split-Path $CodeRoot -Parent) `
        '03_RUNTIMES') `
    "LOCAL_PYTEST_STRUCTURAL_${Timestamp}_${Sha8}"

if (Test-Path -LiteralPath $EvidenceRoot) {
    throw "BLOCKED_TEST_EVIDENCE_ROOT_EXISTS: $EvidenceRoot"
}

New-Item -ItemType Directory -Path $EvidenceRoot -Force |
    Out-Null

$TempRoot = Join-Path $EvidenceRoot 'pytest_tmp'
$JunitPath = Join-Path $EvidenceRoot 'pytest_junit.xml'
$LogPath = Join-Path $EvidenceRoot 'pytest_output.txt'
$TargetsPath = Join-Path $EvidenceRoot 'approved_targets.txt'
$DecisionPath = Join-Path $EvidenceRoot 'decision.txt'

Set-Content `
    -LiteralPath $TargetsPath `
    -Value ($Targets -join [Environment]::NewLine) `
    -Encoding utf8

$env:PYTHONDONTWRITEBYTECODE = '1'
$env:PYTHONNOUSERSITE = '1'
$env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
$env:PYTHONHASHSEED = '0'
$env:PYTHONPATH = $CodeRoot

$PytestArgs = @(
    '-B',
    '-m',
    'pytest',
    '-p',
    'no:cacheprovider',
    '--basetemp',
    $TempRoot,
    '--junitxml',
    $JunitPath
) + $Targets

Push-Location $CodeRoot

try {
    & $ToolPython @PytestArgs *> $LogPath
    $ExitCode = $LASTEXITCODE
}
finally {
    Pop-Location
}

if ($ExitCode -ne 0) {
    Set-Content `
        -LiteralPath $DecisionPath `
        -Value "BLOCKED_STRUCTURAL_TESTS exit=$ExitCode" `
        -Encoding ascii

    throw "BLOCKED_STRUCTURAL_TESTS: exit=$ExitCode; evidence=$EvidenceRoot"
}

$FinalStatus = (
    & git -C $GitTop status --short
)

if ($FinalStatus) {
    Set-Content `
        -LiteralPath $DecisionPath `
        -Value 'BLOCKED_TEST_CONTAMINATION_DIRTY_TREE' `
        -Encoding ascii

    throw "BLOCKED_TEST_CONTAMINATION_DIRTY_TREE: $FinalStatus"
}

Set-Content `
    -LiteralPath $DecisionPath `
    -Value 'GATA_STRUCTURAL_TESTS_PASS' `
    -Encoding ascii

Write-Output 'GATA_STRUCTURAL_TESTS_PASS'
Write-Output "HEAD=$Head"
Write-Output "TARGET_COUNT=$($Targets.Count)"
Write-Output "EVIDENCE_ROOT=$EvidenceRoot"
Write-Output "JUNIT=$JunitPath"
Write-Output "LOG=$LogPath"'''
platform = "win32"

