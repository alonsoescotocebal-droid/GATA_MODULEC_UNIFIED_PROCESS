# -------------------------------------------------------------------------
# GATA Module C — entorno local y aislado de herramientas de prueba.
# No modifica Python global, Git, datos científicos, ACL ni environment.toml.
# -------------------------------------------------------------------------

$BasePython = 'C:\Python314\python.exe'
$ExpectedPythonPrefix = '3.14.'
$ExpectedPytestVersion = '9.1.1'

if ([string]::IsNullOrWhiteSpace($env:CODEX_WORKTREE_PATH)) {
    throw 'BLOCKED_CODEX_WORKTREE_PATH_MISSING'
}

if ([string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) {
    throw 'BLOCKED_LOCALAPPDATA_MISSING'
}

$Worktree = [System.IO.Path]::GetFullPath($env:CODEX_WORKTREE_PATH)

$CodeRoot = Join-Path $Worktree `
    'GATA_ModuleC_pipeline_unified_20260529_110352\01_REPO_COPY'

$LockFile = Join-Path $CodeRoot `
    'config\requirements-test.lock'

$ToolBase = Join-Path $env:LOCALAPPDATA `
    'OpenAI\Codex\project-tools\GATA_MODULEC_UNIFIED_PROCESS'

$ToolRoot = Join-Path $ToolBase `
    'py314-pytest911'

$ToolPython = Join-Path $ToolRoot `
    'Scripts\python.exe'

$LockMarker = Join-Path $ToolRoot `
    '.requirements-test.lock.sha256'

if (-not (Test-Path -LiteralPath $BasePython)) {
    throw "BLOCKED_BASE_PYTHON_MISSING: $BasePython"
}

$PythonVersion = (
    & $BasePython -B -c `
        "import platform; print(platform.python_version())"
).Trim()

if ($LASTEXITCODE -ne 0) {
    throw 'BLOCKED_BASE_PYTHON_EXECUTION'
}

if (-not $PythonVersion.StartsWith(
    $ExpectedPythonPrefix,
    [System.StringComparison]::Ordinal
)) {
    throw "BLOCKED_PYTHON_VERSION_MISMATCH: $PythonVersion"
}

# El entorno puede guardarse antes de que exista el lock.
# No se descarga ni se instala nada hasta que el lock sea versionado.
if (-not (Test-Path -LiteralPath $LockFile)) {
    Write-Output 'GATA_TEST_TOOLING_LOCK_PENDING'
    Write-Output "PYTHON=$BasePython"
    Write-Output "PYTHON_VERSION=$PythonVersion"
    Write-Output "EXPECTED_LOCK=$LockFile"
    Write-Output 'NO_DOWNLOAD_PERFORMED'
    Write-Output 'NO_INSTALLATION_PERFORMED'
    return
}

$LockText = Get-Content -LiteralPath $LockFile -Raw

if ($LockText -notmatch '(?im)^\s*pytest==9\.1\.1(?:\s|$)') {
    throw 'BLOCKED_LOCK_PYTEST_VERSION_MISMATCH'
}

if ($LockText -notmatch '--hash=sha256:[0-9a-fA-F]{64}') {
    throw 'BLOCKED_LOCK_WITHOUT_SHA256_HASHES'
}

$LockHash = (
    Get-FileHash -LiteralPath $LockFile -Algorithm SHA256
).Hash.ToLowerInvariant()

$InstalledLockHash = ''

if (Test-Path -LiteralPath $LockMarker) {
    $InstalledLockHash = (
        Get-Content -LiteralPath $LockMarker -Raw
    ).Trim().ToLowerInvariant()
}

$RebuildTooling = (
    (-not (Test-Path -LiteralPath $ToolPython)) -or
    ($InstalledLockHash -ne $LockHash)
)

if ($RebuildTooling) {
    New-Item -ItemType Directory -Path $ToolBase -Force |
        Out-Null

    $NormalizedToolBase = [System.IO.Path]::GetFullPath($ToolBase)
    $NormalizedToolRoot = [System.IO.Path]::GetFullPath($ToolRoot)

    if (-not $NormalizedToolRoot.StartsWith(
        $NormalizedToolBase + [System.IO.Path]::DirectorySeparatorChar,
        [System.StringComparison]::OrdinalIgnoreCase
    )) {
        throw 'BLOCKED_UNSAFE_TEST_TOOL_ROOT'
    }

    if (Test-Path -LiteralPath $ToolRoot) {
        Remove-Item -LiteralPath $ToolRoot -Recurse -Force
    }

    & $BasePython -B -m venv $ToolRoot

    if ($LASTEXITCODE -ne 0) {
        throw 'BLOCKED_TEST_VENV_CREATION'
    }

    if (-not (Test-Path -LiteralPath $ToolPython)) {
        throw "BLOCKED_TEST_VENV_PYTHON_MISSING: $ToolPython"
    }

    # Neutraliza configuraciones heredadas de pip y Python.
    foreach ($Name in @(
        'PIP_INDEX_URL',
        'PIP_EXTRA_INDEX_URL',
        'PIP_FIND_LINKS',
        'PIP_TARGET',
        'PYTHONPATH'
    )) {
        Remove-Item "Env:$Name" -ErrorAction SilentlyContinue
    }

    $env:PIP_CONFIG_FILE = 'NUL'
    $env:PIP_DISABLE_PIP_VERSION_CHECK = '1'
    $env:PIP_NO_INPUT = '1'
    $env:PYTHONDONTWRITEBYTECODE = '1'
    $env:PYTHONNOUSERSITE = '1'
    $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
    $env:PYTHONHASHSEED = '0'

    & $ToolPython -B -m pip --isolated install `
        --disable-pip-version-check `
        --no-input `
        --no-cache-dir `
        --only-binary=:all: `
        --require-hashes `
        --no-compile `
        --index-url 'https://pypi.org/simple' `
        --requirement $LockFile

    if ($LASTEXITCODE -ne 0) {
        throw 'BLOCKED_LOCKED_TEST_TOOLING_INSTALL'
    }

    Set-Content `
        -LiteralPath $LockMarker `
        -Value $LockHash `
        -Encoding ascii
}

$PytestInfo = @(
    & $ToolPython -B -c `
        "import pathlib,pytest; print(pytest.__version__); print(pathlib.Path(pytest.__file__).resolve())"
)

if ($LASTEXITCODE -ne 0 -or $PytestInfo.Count -lt 2) {
    throw 'BLOCKED_PYTEST_IMPORT'
}

$PytestVersion = "$($PytestInfo[0])".Trim()
$PytestPath = "$($PytestInfo[1])".Trim()

if ($PytestVersion -ne $ExpectedPytestVersion) {
    throw "BLOCKED_PYTEST_VERSION_MISMATCH: $PytestVersion"
}

if (-not $PytestPath.StartsWith(
    [System.IO.Path]::GetFullPath($ToolRoot),
    [System.StringComparison]::OrdinalIgnoreCase
)) {
    throw "BLOCKED_PYTEST_OUTSIDE_PROJECT_TOOLING: $PytestPath"
}

Write-Output 'GATA_PROJECT_TEST_ENVIRONMENT_PASS'
Write-Output "BASE_PYTHON=$BasePython"
Write-Output "PYTHON_VERSION=$PythonVersion"
Write-Output "TEST_PYTHON=$ToolPython"
Write-Output "PYTEST_VERSION=$PytestVersion"
Write-Output "PYTEST_PATH=$PytestPath"
Write-Output "LOCK_SHA256=$LockHash"
Write-Output "TOOL_ROOT=$ToolRoot"'''

