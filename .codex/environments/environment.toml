Write-Section "REMOVE SETUP-GENERATED LOCAL HELPERS"
Remove-DirectoryIfSafe -Path $LocalRoot -Reason "setup generated helper folder" -ForbiddenFragments $Forbidden
Remove-DirectoryIfSafe -Path $TempRoot -Reason "setup temporary folder" -ForbiddenFragments $Forbidden

Write-Section "REMOVE TRANSIENT PYTHON CACHES ONLY"
if (Test-Path -LiteralPath $UnifiedRootFull) {
    Get-ChildItem -LiteralPath $UnifiedRootFull -Directory -Recurse -Force -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -in @("__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache") } |
        ForEach-Object {
            Remove-DirectoryIfSafe -Path $_.FullName -Reason "transient Python/cache directory" -ForbiddenFragments $Forbidden
        }
    Get-ChildItem -LiteralPath $UnifiedRootFull -File -Recurse -Force -ErrorAction SilentlyContinue |
        Where-Object { $_.Extension -eq ".pyc" } |
        ForEach-Object {
            Remove-FileIfSafe -Path $_.FullName -Reason "compiled Python bytecode" -ForbiddenFragments $Forbidden
        }
}

Write-Section "FINAL CLEANUP STATUS"
if (Test-Path -LiteralPath $UnifiedRootFull) {
    try {
        $StatusAfter = @(& git -C $UnifiedRootFull status --short 2>$null)
        Write-Host "GitStatusRowsAfter=$($StatusAfter.Count)"
    } catch {
        Write-Host "GitStatusRowsAfter=UNAVAILABLE"
    }
}
Write-Host "Decision=PASS_CODEX_ENV_CLEANUP_HELPERS_ONLY_EVIDENCE_PRESERVED"
Write-Host "Finished=$(Get-Date -Format s)"
exit 0

'''
